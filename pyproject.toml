[project]
name = "football-ml-agent"
version = "0.1.0"
description = "Natural-language agent over an XGBoost model that predicts international football results"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "joblib>=1.4.0",
    "anthropic>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["football_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored upstream source, kept byte-identical for provenance. See NOTICE.md.
exclude = ["reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
